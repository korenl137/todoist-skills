# Optional user settings for the todo-* skills.
# Copy to ~/.config/todoist-skills/config.toml, or point TODOIST_SKILLS_CONFIG at another path.
# Every key is optional. Without this file the skills follow your existing Todoist projects and labels.
# What you say in a request always wins over this file.

# Which Todoist route the skills use: "mcp" (Todoist MCP server) or "td" (the td CLI). Neither is preferred.
# First-time setup: uncomment one of the two lines below and keep the route you have set up.
# Unset: the route your session has. When both are there, the skills ask once per request and never save the answer. A request can name one too.
# backend = "mcp"
# backend = "td"

# Your own written conventions (any text or Markdown file). The skills read it before labeling or
# auditing. Report disagreements between its conventions and this file's definitions;
# current user decisions win. Do not invent different rules for selection and audit.
# guide = "guide.md"  # relative to this config file; absolute/~ paths also work

[labels]
# Optional independent labels; zero or multiple labels are valid.
selection = "multiple"
# Legacy configs can omit selection (or use "legacy") and keep required_prefix.
# required_prefix = "kind/"
ignore = []

# Meanings determine selection, not prefixes in visible names.
[labels.allowed]
agent = "agent environment setup and operation"
pkm = "knowledge and task management"
design = "design structures, interfaces, workflows or experiments; not mere reading"
write = "write or revise documents"
waiting = "a confirmed outstanding dependency; record its reason and release condition"

# Named goals; multiple goal labels may apply when supported by the task context.
[labels.projects]
community = "the community site project"

# Optional role metadata. Names must be defined in allowed/projects.
# Supported roles: action, project, topic, state. Roles never require a label.
# Unspecified labels default to topic (or project in labels.projects).
[labels.roles]
agent = "topic"
pkm = "topic"
design = "action"
write = "action"
waiting = "state"
community = "project"

# Labels you no longer use. Map each to its replacement (several comma-separated), or to "" to decide per task.
# todo-doctor reports them and never changes them without your confirmation.
[labels.retired]
# "old-community" = "community"
# "kind/do" = ""

# Top-level Todoist projects that split your tasks into areas, and what belongs in each.
# Used to suggest where a task goes and to flag tasks filed in the wrong area. Leave out if unused.
[areas]
# Personal = "home, health, hobbies, personal admin"
# Work = "job projects, meetings, reports"

[grouping]
# Title prefix of a header task that groups related subtasks (a non-completable parent).
# If set, related tasks are added under one header instead of side by side. "" turns grouping off.
header_prefix = ""

# Optional TypeSafe Jev suggestions (https://typesafe.ai). Off by default.
# Needs Python 3.11+, TYPESAFE_API_KEY, and for todo-find/todo-doctor also TODOIST_API_TOKEN
# (environment, or ~/.config/typesafe/.env and ~/.config/todoist/.env).
# Task titles, parent titles, project and label names are sent to TypeSafe.
[jev]
enabled = false
# Also send up to 1500 characters of task descriptions.
send_descriptions = false
